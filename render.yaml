services:
  - type: web
    name: bulk-cert-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bulk-cert-db
          property: connectionString

databases:
  - name: bulk-cert-db
    databaseName: certdb
    plan: free
