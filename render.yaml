services:
  - type: web
    name: bulk-cert-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bulk-cert-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bulk-cert-redis
          property: connectionString
      - key: CERTIFICATES_DIR
        value: /var/data/certificates
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: certificates
      mountPath: /var/data/certificates
      sizeGB: 1

  - type: worker
    name: bulk-cert-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bulk-cert-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bulk-cert-redis
          property: connectionString
      - key: CERTIFICATES_DIR
        value: /var/data/certificates
    disk:
      name: certificates-worker
      mountPath: /var/data/certificates
      sizeGB: 1

databases:
  - name: bulk-cert-db
    plan: free

  - name: bulk-cert-redis
    plan: free
    ipAllowList: []
